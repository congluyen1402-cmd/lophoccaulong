<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Metallic Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Speed Arc Gradient -->
    <linearGradient id="speedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Feather Glow & Shadows -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
    <filter id="corkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <!-- Inner Border Stroke for Depth -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Background Court Pattern (Subtle Diagonal Dynamic Grid) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="3">
    <ellipse cx="256" cy="256" rx="190" ry="190" fill="none" stroke-dasharray="12 12" />
    <path d="M120 400 L392 112" />
    <path d="M160 440 L432 152" />
    <path d="M80 360 L352 72" />
  </g>

  <!-- Dynamic Badminton Racket Frame Arc (Outer Speed Swoosh) -->
  <path d="M96 396 C130 440 200 460 270 446 C370 426 440 330 428 226 C420 156 376 96 312 70" 
        fill="none" stroke="url(#speedGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Racket Head Arc Accent (Gold Smash Flame) -->
  <path d="M140 424 C190 452 250 454 304 436 C384 410 432 334 424 250" 
        fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />

  <!-- ================= HERO SHUTTLECOCK (QUẢ CẦU LÔNG) ================= -->
  <g filter="url(#subtleGlow)" transform="rotate(-26 256 256)">

    <!-- Speed Lines behind shuttlecock -->
    <path d="M226 380 L226 440" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M256 395 L256 465" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M286 380 L286 440" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- Shuttlecock Feather Ribbons / Binding Line -->
    <path d="M182 248 Q256 264 330 248" fill="none" stroke="#d1fae5" stroke-width="6" stroke-linecap="round" />
    <path d="M196 292 Q256 304 316 292" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" />

    <!-- Feathers (Lông Cầu) - Layered for 3D Dynamic Feeling -->
    <!-- Far Left Feather -->
    <path d="M182 248 L152 144 C150 134 160 126 170 130 L208 148 L212 254 Z" 
          fill="#e2e8f0" opacity="0.9" />
    <!-- Center-Left Feather -->
    <path d="M208 253 L194 116 C193 105 205 98 215 103 L246 120 L238 258 Z" 
          fill="#f8fafc" />
    <!-- Center-Right Feather (Main Highlight) -->
    <path d="M238 258 L266 120 C274 102 296 102 304 120 L318 253 Z" 
          fill="#ffffff" />
    <!-- Far Right Feather -->
    <path d="M312 254 L342 148 C352 144 362 152 360 162 L330 248 Z" 
          fill="#f1f5f9" opacity="0.95" />

    <!-- Feather Shafts (Sống lông cầu trung tâm) -->
    <line x1="174" y1="134" x2="204" y2="252" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="214" y1="108" x2="228" y2="256" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="298" y1="108" x2="284" y2="256" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="338" y1="134" x2="308" y2="252" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Shuttlecock Stems Convergence Cone -->
    <polygon points="212,254 300,254 278,330 234,330" fill="#f8fafc" />
    <line x1="234" y1="254" x2="246" y2="330" stroke="#cbd5e1" stroke-width="2" />
    <line x1="256" y1="256" x2="256" y2="330" stroke="#cbd5e1" stroke-width="2" />
    <line x1="278" y1="254" x2="266" y2="330" stroke="#cbd5e1" stroke-width="2" />

    <!-- Cork Tape (Băng dán chân cầu màu vàng kim - Gold Ribbon) -->
    <path d="M232 324 L280 324 L276 342 L236 342 Z" fill="url(#goldGrad)" filter="url(#corkShadow)" />

    <!-- Cork Base (Đế Cầu Bo Tròn Tự Nhiên) -->
    <path d="M234 340 Q256 343 278 340 C280 366 270 382 256 382 C242 382 232 366 234 340 Z" 
          fill="#ffffff" filter="url(#corkShadow)" />
    <!-- Cork Shade for 3D realism -->
    <path d="M242 358 Q256 364 270 358 C266 376 258 380 256 380 C254 380 246 376 242 358 Z" 
          fill="#e2e8f0" opacity="0.6" />
  </g>

  <!-- Sparkle / Star of Excellence (Ngôi sao vàng tượng trưng cho kỹ thuật chuẩn & chiến thắng) -->
  <g transform="translate(368, 116)">
    <path d="M0 -18 L4 -5 L17 -5 L7 3 L10 16 L0 8 L-10 16 L-7 3 L-17 -5 L-4 -5 Z" 
          fill="url(#goldGrad)" filter="url(#corkShadow)" />
  </g>
</svg>
